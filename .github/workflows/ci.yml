name: Offline verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  core:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/check_skills.py
      - run: python -m agentic_trading.cli --database state/ci-demo.sqlite demo --output state/demo-result.json
      - run: python -m unittest discover -s vendor/day-trader-fr/tests -q
      - uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.os }}-${{ matrix.python }}
          path: state/demo-result.json
  tradingview-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vendor/codex-tradingview-xau-btc-mcp/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: vendor/codex-tradingview-xau-btc-mcp
      - run: npm test
        working-directory: vendor/codex-tradingview-xau-btc-mcp
